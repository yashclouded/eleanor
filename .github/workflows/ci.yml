name: MVP release checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run content:check
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: supabase start -x studio,imgproxy,logflare,vector,supavisor
      - run: npm run db:reset
      - name: Configure the isolated test stack
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process'
          import { appendFileSync, writeFileSync } from 'node:fs'
          const local = JSON.parse(execFileSync('supabase', ['status', '-o', 'json'], { encoding: 'utf8' }))
          const values = {
            VITE_SUPABASE_URL: local.API_URL,
            VITE_SUPABASE_PUBLISHABLE_KEY: local.PUBLISHABLE_KEY ?? local.ANON_KEY,
            SUPABASE_SECRET_KEY: local.SECRET_KEY ?? local.SERVICE_ROLE_KEY,
            SUPABASE_SERVICE_ROLE_KEY: local.SERVICE_ROLE_KEY,
            DATABASE_URL: local.DB_URL,
          }
          for (const [key, value] of Object.entries(values)) {
            if (!value) throw new Error(`Missing local test configuration: ${key}`)
            console.log(`::add-mask::${value}`)
            appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`)
          }
          writeFileSync('.env.local', `VITE_SUPABASE_URL=${values.VITE_SUPABASE_URL}\nVITE_SUPABASE_PUBLISHABLE_KEY=${values.VITE_SUPABASE_PUBLISHABLE_KEY}\n`)
          writeFileSync('/tmp/eleanor-functions.env', [
            'APP_ORIGIN=http://127.0.0.1:5173',
            'ELEANOR_TEST_CLOCK=1',
            'ENABLE_TEST_JUDGE0=1',
            'JUDGE0_LANGUAGES={"python":71,"cpp":54,"javascript":63}',
          ].join('\n') + '\n')
          JS
          supabase functions serve --env-file /tmp/eleanor-functions.env > /tmp/eleanor-functions.log 2>&1 &
          for i in {1..60}; do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:54321/functions/v1/api/me)
            if [ "$status" = 401 ]; then break; fi
            sleep 1
          done
          test "$status" = 401
      - run: npm run test:db
      - name: Build isolated local content fixtures
        run: |
          npm run content:code:build
          npm run content:sync -- --include-drafts
      - run: npm run test:api
      - run: npm run test:e2e
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-failure-evidence
          path: |
            test-results/
            playwright-report/
            /tmp/eleanor-functions.log
      - run: supabase stop --no-backup
        if: always()
